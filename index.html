<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Elvis SHIMWA - Web Designer and Programmer</title>
    <meta name="description" content="Elvis SHIMWA is a Web Designer and Programmer specializing in creating user-friendly and visually appealing web applications." />
    <meta name="theme-color" content="#142238" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
